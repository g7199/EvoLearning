[project]
name = "evolearning"
version = "1.0.0"
description = "EvoLearning: Evolutionary Expert-Guided RL for Learning Path Recommendation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "tqdm>=4.65",
    "pykt-toolkit @ git+https://github.com/pykt-team/pykt-toolkit.git",
    "python-dotenv>=1.0",
    "gdown>=5.0",
    "einops>=0.6",
    "matplotlib>=3.5",
    "networkx>=2.8",
    "transformers>=4.20",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=0.30"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["simpath*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
