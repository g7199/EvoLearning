[project]
name = "simpath"
version = "0.1.0"
description = "SimPath: Simulation-in-the-Loop Learning Path Recommendation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "umap-learn>=0.5",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "jsonlines>=4.0",
    "requests>=2.31",
    "statsmodels>=0.14",
    "scikit-posthocs>=0.8",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=0.30"]
rl = ["stable-baselines3>=2.1"]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
