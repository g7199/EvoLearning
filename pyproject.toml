[project]
name = "evolearning"
version = "1.0.0"
description = "EvoLearning: Evolutionary Expert-Guided RL for Learning Path Recommendation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "tqdm>=4.65",
    "pykt>=0.0.1",
    "python-dotenv>=1.0",
    "gdown>=5.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=0.30"]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
