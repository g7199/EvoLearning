seed: 42
seeds: [42, 123, 456, 789, 1024]  # 5-run average
device: "cpu"

data:
  min_interactions: 20
  max_interactions: 5000
  session_gap_minutes: 30
  fast_answer_seconds: 5
  stale_days: 14
  split_ratios: [0.7, 0.1, 0.1, 0.1]  # train/val/rec_input/held_out

kt:
  akt:
    embedding_dim: 256
    num_heads: 8
    num_blocks: 4
    dropout: 0.1
  saint:
    d_model: 256
    num_heads: 8
    enc_layers: 4
    dec_layers: 4
    dropout: 0.1
  dkt:
    hidden_dim: 256
    num_layers: 2
    dropout: 0.1
  training:
    lr: 0.001
    batch_size: 64
    max_seq_len: 200
    epochs: 100
    patience: 10

paths:
  K: 5              # number of candidate paths
  L: 8              # path length
  mastery_threshold: 0.6
  zpd_low_offset: 0.1
  zpd_high_offset: 0.3
  stale_review_cap: 3
  per_kc_cap: 10

personas:
  N_sim: 10
  grit:
    learn_rate: 0.15
    forget_penalty: 0.05
    dropout_base_coeff: 0.02
    dropout_base_exp: 1.0
    difficulty_sensitivity: 0.2
    skip_threshold: null
    p_correct_boost: 0.05
    time_multiplier: 1.3
  fragile:
    learn_rate: 0.10
    forget_penalty: 0.10
    dropout_base_coeff: 0.15
    dropout_base_exp: 1.5
    difficulty_sensitivity: 0.5
    skip_threshold: 0.7
    p_correct_boost: -0.08
    time_multiplier: 0.7

selection:
  strategy: "minimax_regret"
  weights:
    w1: 0.5  # mastery gain
    w2: 0.3  # survival rate
    w3: 0.2  # completion efficiency
  dropout_risk_threshold: 0.3
  low_mastery_threshold: 0.3

evaluation:
  alpha: 0.05
  n_comparisons: 24  # 6 baselines x 4 metrics
  n_sim_eval: 10

llm:
  provider: "mock"  # mock | openai | anthropic
  temperature: 0.6
  max_tokens: 1024
